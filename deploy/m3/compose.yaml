# Local M3 recovery-smoke services only. These credentials are not for production.
services:
  postgres:
    image: postgres@sha256:5d143123fdf80462d1778cd4f24b9f7ca13c87174bca19141fb194c5a1ebca59
    restart: "no"
    environment:
      POSTGRES_USER: verirun
      POSTGRES_PASSWORD: verirun-test-only
      POSTGRES_DB: verirun
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verirun -d verirun"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - verirun-m3-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: "no"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: verirun-test
      MINIO_ROOT_PASSWORD: verirun-test-secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - verirun-m3-minio:/data

volumes:
  verirun-m3-postgres:
  verirun-m3-minio:
